org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true

PROP_COMPILE_SDK_VERSION=36
PROP_MIN_SDK_VERSION=24
PROP_TARGET_SDK_VERSION=36
PROP_NDK_VERSION=30.0.15729638
PROP_CMAKE_VERSION=3.22.1

# Separate architectures with ':'. Add armeabi-v7a, x86, or x86_64 as needed.
PROP_APP_ABI=arm64-v8a

# Debug builds package plain Lua sources. Release builds compile Lua bytecode.
# Override either default with -PPROP_COMPILE_SCRIPT=0 or 1.
# Enable XXTEA with -PPROP_LUA_ENCRYPT=1 plus PROP_LUA_ENCRYPT_KEY and
# PROP_LUA_ENCRYPT_SIGN.

# Uncomment and fill in signing information for release builds.
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password
#RELEASE_KEY_ALIAS=alias
#RELEASE_KEY_PASSWORD=password
