plugins {
    id 'com.android.application'
}

def cocos2dxRootPath = gradle.ext.cocos2dxRootPath

android {
    namespace 'org.cocos2dx.hellocpp'
    compileSdk PROP_COMPILE_SDK_VERSION.toInteger()

    ndkVersion PROP_NDK_VERSION

    defaultConfig {
        applicationId "org.cocos2dx.hellocpp"
        minSdk PROP_MIN_SDK_VERSION.toInteger()
        targetSdk PROP_TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                targets 'MyGame'
                arguments "-DANDROID_STL=c++_static",
                          "-DCOCOS2DX_ROOT_PATH=${cocos2dxRootPath}"
                cppFlags "-frtti -fexceptions -fsigned-char"
            }
        }

        ndk {
            abiFilters.addAll(PROP_APP_ABI.split(':'))
        }
    }

    sourceSets {
        main {
            assets.srcDirs 'src/main/assets', "$buildDir/generated/assets/cocos"
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version PROP_CMAKE_VERSION
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }

    }
}

tasks.register('copyCocosResources', Copy) {
    from '../../Resources'
    into layout.buildDirectory.dir('generated/assets/cocos')
    exclude '**/*.gz'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyCocosResources')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
}
