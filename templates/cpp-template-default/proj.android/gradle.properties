org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true

# Android toolchain versions used by a newly generated project.
PROP_COMPILE_SDK_VERSION=36
PROP_MIN_SDK_VERSION=23
PROP_TARGET_SDK_VERSION=36
PROP_NDK_VERSION=30.0.15729638
PROP_CMAKE_VERSION=3.22.1

# Separate architectures with ':'. arm64-v8a is the default required by
# current Play Store releases; add armeabi-v7a, x86, or x86_64 as needed.
PROP_APP_ABI=arm64-v8a

# uncomment it and fill in sign information for release mode
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password of keystore
#RELEASE_KEY_ALIAS=alias of key
#RELEASE_KEY_PASSWORD=password of key
